services:
  - hostname: hardened
    type: nodejs@22
    # 2..6 rather than 2..2. An import whose values match the stored config is a
    # no-op ("Queued processes: 0"), so changing maxContainers forces Zerops to
    # re-evaluate the service and honour the minimum.
    minContainers: 2
    maxContainers: 6
    override: true
